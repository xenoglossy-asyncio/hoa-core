  enUS: Strikes the 2 nearest enemies with fire, dealing damage and applying 2 stacks of Burning.
  zhCN: 以火焰打击最近的2个敌人，造成伤害并施加2层燃烧。
- id: hoa.ui.glue.strikes_the_3_enemies_with_the_most_poison_within_20_yards_f
  enUS: Strikes the 3 enemies with the most Poison within 20 yards for Nature damage plus all the damage their Poison would still deal, without removing it. For 5 sec, your hits apply 2 additional stacks of Poison.
  zhCN: 打击20码内中毒层数最多的3个敌人，造成自然伤害，并附加其中毒本应继续造成的全部伤害，但不消耗中毒层数。在5秒内，你的命中会额外施加2层中毒。
- id: hoa.ui.glue.strikes_the_3_most_poisoned_enemies
  enUS: Strikes the 3 most poisoned enemies
  zhCN: 打击中毒最深的3个敌人
- id: hoa.ui.glue.strikes_the_3_nearest_enemies_within_10_yards_and_heals_you_
  enUS: Strikes the 3 nearest enemies within 10 yards and heals you for 0.5% of your maximum health per enemy hit, up to 2.5%. Its critical strikes Enrage you, granting 25% Haste for 4 sec.
  zhCN: 打击10码内最近的3个敌人，并每命中一个敌人为你恢复0.5%最大生命值，最多2.5%。其致命一击会使你进入狂怒状态：急速提高25%，持续4秒。
- id: hoa.ui.glue.strikes_the_3_nearest_enemies_within_8_yards_for_damage_and_
  enUS: 'Strikes the 3 nearest enemies within 8 yards for damage and heals you for 0.5% of your maximum health per enemy hit, up to 2.5%. Critical strikes Enrage you: 25% Haste for 4 sec.'
  zhCN: 打击你8码内最近的3个敌人，造成伤害，并每命中一个敌人为你恢复0.5%最大生命值，最多2.5%。致命一击会使你进入狂怒状态：急速提高25%，持续4秒。
- id: hoa.ui.glue.strikes_the_enemy_with_the_most_bleed_stacks
  enUS: Strikes the enemy with the most Bleed stacks
  zhCN: 打击流血层数最多的敌人
- id: hoa.ui.glue.strikes_the_enemy_with_the_most_poison_for_nature_damage_and
  enUS: Strikes the enemy with the most Poison for Nature damage, and your hits apply 2 more stacks of Poison for 5 sec.
  zhCN: 打击中毒层数最多的敌人，造成自然伤害，并使你的攻击在5秒内额外施加2层中毒。
- id: hoa.ui.glue.strikes_the_most_poisoned_enemy
  enUS: Strikes the most poisoned enemy
  zhCN: 打击中毒最深的敌人
- id: hoa.ui.glue.strikes_the_nearest_enemy_for_heavy_damage_and_30_of_it_to_e
  enUS: Strikes the nearest enemy for heavy damage and 30% of it to enemies within 5 yards of the target.
  zhCN: 打击最近的敌人，造成高额伤害，并对目标5码内的敌人造成30%的伤害。
- id: hoa.ui.glue.strikes_the_nearest_enemy_within_12_yards_twice_with_weapon_
  enUS: Strikes the nearest enemy within 12 yards twice, with weapon and lightning, applying 2 stacks of Static and 2 stacks of Nature Vulnerability. Counts as 2 hits for Maelstrom Weapon.
  zhCN: 以武器和闪电双重打击12码内最近的敌人两次，施加2层静电和2层自然易伤。计为漩涡武器的2次命中。
- id: hoa.ui.glue.strikes_the_nearest_enemy_within_12_yards_twice_with_weapon__2
  enUS: Strikes the nearest enemy within 12 yards twice, with weapon and lightning, for damage, applying 2 stacks of Static and 2 stacks of Nature Vulnerability.
  zhCN: 以武器和闪电双重打击12码内最近的敌人，造成伤害，施加2层静电和2层自然易伤。
- id: hoa.ui.glue.strikes_the_strongest_enemy_within_30_yards_for_heavy_holy_d
  enUS: Strikes the strongest enemy within 30 yards for heavy Holy damage. Undead and Demons take triple damage, elites and bosses double. Critical strikes from your other Paladin spells reset its cooldown, at most once a sec.
  zhCN: 打击30码内最强的敌人，造成高额神圣伤害。亡灵和恶魔受到三倍伤害，精英和首领受到两倍伤害。你的其他圣骑士法术造成致命一击时，会重置此法术的冷却时间，每秒至多一次。
- id: hoa.ui.glue.strikes_the_strongest_enemy_within_30_yards_for_holy_damage_
  enUS: Strikes the strongest enemy within 30 yards for Holy damage and binds it for 2 sec, dealing Holy damage every sec while bound. Bosses and mini-bosses are struck first but cannot be bound.
  zhCN: 打击30码内最强的敌人，造成神圣伤害并将其束缚2秒，束缚期间每秒造成神圣伤害。首领和小首领会被优先打击，但无法被束缚。
- id: hoa.ui.glue.strikes_up_to_6_enemies_in_a_cone
  enUS: Strikes up to 6 enemies in a cone
  zhCN: 打击锥形范围内的最多6个敌人
- id: hoa.ui.glue.strikes_up_to_6_enemies_within_18_yards_in_a_cone_toward_the
  enUS: Strikes up to 6 enemies within 18 yards in a cone toward the nearest enemy.
  zhCN: 朝最近的敌人方向，打击18码锥形范围内的最多6个敌人。
- id: hoa.ui.glue.stuns_the_strongest_enemy
  enUS: Stuns the strongest enemy
  zhCN: 使最强的敌人昏迷
- id: hoa.ui.glue.subtlety
  enUS: Subtlety
  zhCN: 敏锐
