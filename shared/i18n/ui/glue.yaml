  enUS: Shoots the nearest enemy for Arcane damage.
  zhCN: 射击最近的敌人，造成奥术伤害。
- id: hoa.ui.glue.shots_volleys_and_piercing_arrows_with_hunter_s_mark_on_the_
  enUS: Shots, volleys and piercing arrows, with Hunter's Mark on the biggest group.
  zhCN: 射击、箭雨和贯穿之箭，并在最大的敌群上标记猎人印记。
