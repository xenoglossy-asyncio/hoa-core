- id: hoa.ui.glue.press_r_to_shift_into_your_next_form_druid_spells_deal_and_h
  enUS: Press R to shift into your next form. Druid spells deal and heal 30% more in their form.|n|n|cffffffffMoonkin Form (30 yd range):|r Wrath strikes the nearest enemy for Nature damage, splashing nearby enemies. Every 3 sec, Starfall strikes 3 enemies afflicted by Moonfire.|n|n|cffffffffCat Form (10 yd range):|r Claws the nearest enemy for Physical damage and causes Bleed. Movement speed increased by 15%. Critical strikes cause Bleed.|n|n|cffffffffBear Form (10 yd range):|r Mauls the nearest enemy for Physical damage. Damage taken reduced by 35%, but spells of other forms deal 20% less. Swipe deals 8% more per nearby enemy. Every 6 sec, roars to Daze nearby enemies and reduce their damage by 25%.|n|n|cffffffffTree of Life (20 yd range):|r Vines lash 3 enemies for Nature damage, each hit healing you for 0.3% of your maximum health. Calls 1 additional Treant. Rejuvenation blooms 50% faster.
  zhCN: 按R键变形为下一个形态。德鲁伊法术在对应形态下造成的伤害和治疗提高30%。|n|n|cffffffff枭兽形态（射程30码）：|r愤怒打击最近的敌人，造成自然伤害并溅射附近敌人。每3秒，星落术会打击3个中了月火术的敌人。|n|n|cffffffff猎豹形态（射程10码）：|r爪击最近的敌人，造成物理伤害并施加流血。移动速度提高15%。致命一击会造成流血。|n|n|cffffffff巨熊形态（射程10码）：|r重殴最近的敌人，造成物理伤害。受到的伤害降低35%，但其他形态的法术造成的伤害降低20%。每有一个附近敌人，横扫的伤害提高8%。每6秒发出咆哮，使附近敌人眩晕并使其伤害降低25%。|n|n|cffffffff生命之树（射程20码）：|r藤蔓抽打3个敌人，造成自然伤害，每次命中为你恢复0.3%最大生命值。额外召唤1个树人。回春术的绽放速度加快50%。
- id: hoa.ui.glue.press_r_to_shift_into_your_next_form_druid_spells_deal_and_h_2
  enUS: Press R to shift into your next form. Druid spells deal and heal 30% more in their form.|n|n|cffffffffMoonkin Form:|r Wrath strikes the nearest enemy for Nature damage, splashing enemies within 5 yards. Every 3 sec, Starfall strikes 3 enemies afflicted by Moonfire.|n|n|cffffffffCat Form:|r Claws the nearest enemy for Physical damage and 1 stack of Bleed, splashing enemies within 5 yards. Attacks 50% faster. Movement speed increased by 15%. Critical strikes apply 1 stack of Bleed.|n|n|cffffffffBear Form:|r Mauls the nearest enemy for Physical damage, splashing enemies within 5 yards. Damage taken reduced by 35%, but spells of other forms deal and heal 20% less. Swipe deals 8% more per enemy within 8 yards, up to 8 enemies. Every 6 sec, roars to Daze enemies within 10 yards and reduce their damage by 25% for 4 sec.|n|n|cffffffffTree of Life:|r Vines lash the 3 nearest enemies for Nature damage, splashing enemies within 5 yards, each hit healing you for 0.3% of your maximum health. Calls 1 additional Treant. Rejuvenation blooms 50% faster.  [DB version; character select keeps its '(30/10/10/20 yd range)' labels]
  zhCN: 按R键变形为下一个形态。德鲁伊法术在对应形态下造成的伤害和治疗提高30%。|n|n|cffffffff枭兽形态：|r愤怒会打击最近的敌人，造成自然伤害并溅射5码内的敌人。每3秒，星落术会打击3个中了月火术的敌人。|n|n|cffffffff猎豹形态：|r爪击最近的敌人，造成物理伤害并施加1层流血，同时溅射5码内的敌人。攻击速度提高50%。移动速度提高15%。致命一击会施加1层流血。|n|n|cffffffff巨熊形态：|r重殴最近的敌人，造成物理伤害，并溅射5码内的敌人。受到的伤害降低35%，但其他形态的法术造成的伤害和治疗降低20%。每有一个8码内的敌人，横扫的伤害提高8%，最多计算8个敌人。每6秒发出咆哮，使10码内的敌人眩晕，并使其伤害降低25%，持续4秒。|n|n|cffffffff生命之树：|r藤蔓抽打最近的3个敌人，造成自然伤害，并溅射5码内的敌人，每次命中为你恢复0.3%最大生命值。额外召唤1个树人。回春术的绽放速度加快50%。
