  enUS: Shreds the most Bleeding enemy for damage, increased by 3% per stack of Bleed on it. Empowered in Cat Form.
  zhCN: 撕碎流血层数最多的敌人，造成伤害，目标每层流血使伤害提高3%。猎豹形态下获得强化。
