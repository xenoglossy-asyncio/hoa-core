  enUS: Every 3rd strike from your other Paladin spells releases a burst of light, dealing Holy damage to the target and every enemy within 5 yards of it.
  zhCN: 你的其他圣骑士法术每第3次打击会释放一次圣光爆发，对目标及其5码内的所有敌人造成神圣伤害。
