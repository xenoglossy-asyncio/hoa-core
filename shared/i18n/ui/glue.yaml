  enUS: Fires a shot that pierces every enemy in a line, dealing damage. Aims at the Marked group, or else the largest group.
  zhCN: 发射一发贯穿直线上所有敌人的射击，造成伤害。优先瞄准被标记的敌群，其次瞄准最大的敌群。
