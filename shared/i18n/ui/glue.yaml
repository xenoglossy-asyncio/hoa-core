- id: hoa.ui.glue.every_5th_melee_hit_hurls_a_free_lightning_bolt_at_the_neare
  enUS: Every 5th melee hit hurls a free Lightning Bolt at the nearest enemy, or a Chain Lightning if you have it, dealing Nature damage. Melee hits are Windfury Weapon swings, Stormstrike and Feral Spirit bites.
  zhCN: 每5次近战命中会免费向最近的敌人掷出一道闪电箭，若你拥有闪电链则改为闪电链，造成自然伤害。近战命中包括风怒武器挥击、风暴打击和野性狼魂的撕咬。
- id: hoa.ui.glue.every_hit_from_your_other_paladin_spells_splash_and_area_hit
  enUS: Every hit from your other Paladin spells, splash and area hits included, deals 20% extra as Holy damage.
  zhCN: 你的其他圣骑士法术的每次命中，包括溅射和范围命中，都额外造成20%的神圣伤害。
