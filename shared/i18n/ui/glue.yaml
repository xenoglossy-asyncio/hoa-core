- id: hoa.ui.glue.fires_a_shadow_bolt_at_the_nearest_enemy_dealing_damage_nigh
  enUS: 'Fires a Shadow Bolt at the nearest enemy, dealing damage. Nightfall: enemies that die with your afflictions on them fire a free bolt, at most 1 a sec.'
  zhCN: 向最近的敌人射出一发暗影箭，造成伤害。夜幕：身上带有你的持续伤害效果而死亡的敌人会触发一发免费暗影箭，每秒至多1发。
- id: hoa.ui.glue.fires_a_shadow_bolt_at_the_nearest_enemy_dealing_shadow_dama
  enUS: 'Fires a Shadow Bolt at the nearest enemy, dealing Shadow damage, 4% more per stack of Decay on the target, up to 30 stacks. Nightfall: enemies that die with Decay, Agony or Burning on them fire a free Shadow Bolt at the nearest enemy, at most 1 per sec.'
  zhCN: 向最近的敌人射出一发暗影箭，造成暗影伤害，目标身上每层腐朽使伤害提高4%，最多30层。夜幕：身上带有腐朽、痛苦或燃烧而死亡的敌人会向最近的敌人发射一发免费暗影箭，每秒至多1发。
