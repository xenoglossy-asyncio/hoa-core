  zhCN: 打击你10码内的所有敌人。
- id: hoa.ui.glue.strikes_all_enemies_within_10_yards_of_you_dealing_8_more_da
  enUS: Strikes all enemies within 10 yards of you, dealing 8% more damage per stack of Bleed on the target, up to 30 stacks. Bleeding enemies also take the damage their Bleed would deal over the next 2 sec, keeping their stacks.
  zhCN: 打击你10码内的所有敌人，目标每层流血使伤害提高8%，最多计算30层。流血状态的敌人还会立即承受其流血在未来2秒内本应造成的伤害，并保留层数。
- id: hoa.ui.glue.strikes_all_enemies_within_10_yards_of_you_normal_enemies_be
  enUS: Strikes all enemies within 10 yards of you. Normal enemies below 20% health die instantly; elites and bosses below 20% take triple damage. Its kills Enrage you, granting 25% Haste for 4 sec.
  zhCN: 打击你10码内的所有敌人。生命值低于20%的普通敌人立即死亡；生命值低于20%的精英和首领受到三倍伤害。其击杀会使你进入狂怒状态：急速提高25%，持续4秒。
- id: hoa.ui.glue.strikes_all_enemies_within_8_yards_of_you_for_damage
  enUS: Strikes all enemies within 8 yards of you for damage.
  zhCN: 打击你8码内的所有敌人，造成伤害。
- id: hoa.ui.glue.strikes_all_enemies_within_8_yards_of_you_for_damage_8_more_
  enUS: Strikes all enemies within 8 yards of you for damage, 8% more per stack of Bleed on the target, up to 30 stacks.
  zhCN: 打击你8码内的所有敌人，造成伤害，目标每层流血使伤害提高8%，最多计算30层。
- id: hoa.ui.glue.strikes_all_enemies_within_8_yards_of_you_for_damage_normal_
  enUS: 'Strikes all enemies within 8 yards of you for damage. Normal enemies below 20% health die instantly; elites and bosses below 20% take triple damage. Kills Enrage you: 25% Haste for 4 sec.'
  zhCN: 打击你8码内的所有敌人，造成伤害。生命值低于20%的普通敌人立即死亡；生命值低于20%的精英和首领受到三倍伤害。击杀会使你进入狂怒状态：急速提高25%，持续4秒。
- id: hoa.ui.glue.strikes_back_when_you_are_hit
  enUS: Strikes back when you are hit
  zhCN: 受到攻击时进行反击
