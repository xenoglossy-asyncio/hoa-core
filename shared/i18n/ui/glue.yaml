- id: hoa.ui.glue.every_sec_heals_you_for_0_25_of_your_maximum_health_per_near
  enUS: Every sec, heals you for 0.25% of your maximum health per nearby enemy, up to 5. Empowered in Bear Form.
  zhCN: 每秒根据附近的敌人数量为你恢复生命值，每个敌人恢复0.25%最大生命值，最多计算5个。巨熊形态下获得强化。
- id: hoa.ui.glue.every_sec_heals_you_for_0_3_of_your_maximum_health_and_lashe
  enUS: Every sec, heals you for 0.3% of your maximum health and lashes the 3 nearest enemies within 10 yards for Nature damage. Healing past full health makes your attacks and dots tick 15% more often for 3 sec. Empowered in Tree of Life.
  zhCN: 每秒为你恢复0.3%最大生命值，并抽打10码内最近的3个敌人，造成自然伤害。超出满生命值的治疗会使你的攻击和持续伤害效果的结算频率在3秒内提高15%。生命之树形态下获得强化。
