- id: hoa.ui.glue.your_dash_becomes_blink_teleporting_you_with_1_additional_ch
  enUS: Your dash becomes Blink, teleporting you, with 1 additional charge and a 30% shorter cooldown. Each Blink sets off an Arcane Explosion where you leave, dealing Arcane damage to enemies within 10 yards. Enemies within 10 yards of where you land gain 2 stacks of Chill, and Frost Nova is ready again. Takes a spell slot.
  zhCN: 你的冲刺变为闪现术，使你瞬间传送，充能次数增加1次，冷却时间缩短30%。每次闪现都会在你离开的位置引发一次魔爆术，对10码内的敌人造成奥术伤害。你落地点10码内的敌人获得2层冰寒，且冰霜新星会立即就绪。占用一个法术槽位。
- id: hoa.ui.glue.your_dash_becomes_blink_teleporting_you_with_1_additional_ch_2
  enUS: Your dash becomes Blink, teleporting you, with 1 additional charge and a 30% shorter cooldown. Each Blink sets off an Arcane Explosion where you leave, dealing Arcane damage to enemies within 10 yards. Takes a spell slot.
