- id: hoa.ui.glue.places_a_fire_trap_that_explodes_when_an_enemy_comes_close_d
  enUS: Places a fire trap that explodes when an enemy comes close, dealing damage and burning the ground for 4 sec, applying Burning.
  zhCN: 放置一个火焰陷阱，在敌人靠近时爆炸，造成伤害并灼烧地面4秒，施加燃烧。
- id: hoa.ui.glue.places_a_fire_trap_that_explodes_when_an_enemy_comes_close_d_2
  enUS: Places a fire trap that explodes when an enemy comes close, dealing damage and leaving burning ground for 4 sec that applies Burning.
  zhCN: 放置一个火焰陷阱，在敌人靠近时爆炸，造成伤害并留下燃烧的地面，持续4秒，施加燃烧。
- id: hoa.ui.glue.places_a_frost_trap_that_goes_off_when_an_enemy_comes_close_
  enUS: Places a frost trap that goes off when an enemy comes close, slowing normal enemies inside by 60% for 6 sec. They take 5% more damage.
  zhCN: 放置一个冰霜陷阱，在敌人靠近时触发，使范围内的普通敌人减速60%，持续6秒。它们受到的伤害提高5%。
- id: hoa.ui.glue.places_a_trap_that_releases_4_vipers_when_an_enemy_comes_clo
  enUS: Places a trap that releases 4 vipers when an enemy comes close. Each viper rushes one of the 4 nearest enemies and bursts into a poison cloud for 4 sec. Enemies inside gain 1 stack of Poison every 0.5 sec.
  zhCN: 放置一个陷阱，在敌人靠近时放出4条毒蛇。每条毒蛇会冲向最近的4个敌人之一，并爆裂成一团持续4秒的毒云。范围内的敌人每0.5秒获得1层中毒。
- id: hoa.ui.glue.plant_decay_on_the_far_edge_of_the_horde_and_spread_it_from_
  enUS: Plant Decay on the far edge of the horde and spread it from mind to mind.
  zhCN: 在怪潮的边缘种下腐朽，并让它在敌人之间蔓延。
- id: hoa.ui.glue.plants_a_healing_stream_totem_at_your_feet_that_heals_you_fo
  enUS: Plants a Healing Stream Totem at your feet that heals you for 1% of your maximum health every sec while you stay within 15 yards.
  zhCN: 在你脚下插入一根治疗之泉图腾，只要你停留在15码内，它就会每秒为你恢复1%最大生命值。
- id: hoa.ui.glue.plants_a_magma_totem_at_your_feet_that_pulses_fire_every_2_s
  enUS: Plants a Magma Totem at your feet that pulses fire every 2 sec, dealing Fire damage and 1 stack of Burning to enemies within 8 yards.
  zhCN: 在你脚下插入一根熔岩图腾，每2秒喷发一次火焰，对8码内的敌人造成火焰伤害并施加1层燃烧。
- id: hoa.ui.glue.plants_a_searing_totem_at_your_feet_that_hurls_fire_at_2_ene
  enUS: Plants a Searing Totem at your feet that hurls fire at 2 enemies within 20 yards, applying Burning. It is replanted when you move away.
  zhCN: 在你脚下插入一根灼热图腾，向20码内的2个敌人掷出火焰，施加燃烧。你远离时图腾会重新插到你脚下。
