  enUS: Summon Elemental
  zhCN: 召唤元素
- id: hoa.ui.glue.summons_2_spirit_wolves_whose_bites_apply_1_stack_of_static_
  enUS: Summons 2 spirit wolves whose bites apply 1 stack of Static. Every 3 sec, each wolf cleaves all enemies in front of it within 6 yards.
  zhCN: 召唤2头灵魂之狼，它们的撕咬会施加1层静电。每3秒，每头狼会顺劈其前方6码内的所有敌人。
- id: hoa.ui.glue.summons_2_spirit_wolves_whose_bites_apply_static
  enUS: Summons 2 spirit wolves whose bites apply Static.
  zhCN: 召唤2头灵魂之狼，它们的撕咬会施加静电。
- id: hoa.ui.glue.summons_2_treants_their_attacks_apply_moonfire_and_every_6_s
  enUS: Summons 2 Treants. Their attacks apply Moonfire, and every 6 sec they root their target and nearby enemies for 2 sec. Empowered in Tree of Life, which calls 1 additional Treant.
  zhCN: 召唤2个树人。它们的攻击会施加月火术，并每6秒定身其目标及附近敌人2秒。生命之树形态下获得强化，并额外召唤1个树人。
- id: hoa.ui.glue.summons_2_treants_whose_attacks_apply_1_stack_of_moonfire_ev
  enUS: Summons 2 Treants whose attacks apply 1 stack of Moonfire. Every 6 sec, each Treant roots its target and normal enemies within 5 yards for 2 sec. Empowered in Tree of Life, which calls 1 additional Treant.
  zhCN: 召唤2个树人，它们的攻击会施加1层月火术。每6秒，每个树人定身其目标及5码内的普通敌人2秒。生命之树形态下获得强化，并额外召唤1个树人。
- id: hoa.ui.glue.summons_a_cat_that_fights_for_you_its_attacks_apply_1_stack_
  enUS: Summons a cat that fights for you. Its attacks apply 1 stack of Bleed, its Claw applies 4 stacks, and its Swipe strikes all enemies in front of it.
  zhCN: 召唤一只猫为你而战。它的攻击施加1层流血，爪击施加4层，横扫则命中其前方的所有敌人。
