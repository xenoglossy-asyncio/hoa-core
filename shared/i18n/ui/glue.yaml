  enUS: Fires a shot that pierces every enemy in a line, dealing damage. Aims at the Marked group, or else the largest group. With an Explosive Arrow loaded, the shot explodes on its first hit, dealing its damage to all enemies within 8 yards.
  zhCN: 发射一发贯穿直线上所有敌人的射击，造成伤害。优先瞄准被标记的敌群，其次瞄准最大的敌群。装填爆炸箭时，该射击会在首次命中时爆炸，对8码内的所有敌人造成其伤害。
