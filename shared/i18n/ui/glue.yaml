  zhCN: 从腐朽最深的敌人身上扩散腐朽
- id: hoa.ui.glue.stabs_the_nearest_enemy_for_damage
  enUS: Stabs the nearest enemy for damage.
  zhCN: 刺击最近的敌人，造成伤害。
- id: hoa.ui.glue.stabs_the_nearest_enemy_twice_for_damage_each_stab_applying_
  enUS: Stabs the nearest enemy twice for damage, each stab applying 1 stack of Poison, plus 1 for every 5 stacks it already has. Deals 30% more to Poisoned enemies.
  zhCN: 刺击最近的敌人两次，造成伤害，每次刺击施加1层中毒，目标每已有5层中毒则额外施加1层。对中毒的敌人造成的伤害提高30%。
- id: hoa.ui.glue.stabs_the_nearest_enemy_with_both_daggers_for_damage_each_st
  enUS: Stabs the nearest enemy with both daggers for damage, each stab applying 1 stack of Poison. Deals 30% more to Poisoned enemies.
  zhCN: 双持匕首刺击最近的敌人，造成伤害，每次刺击施加1层中毒。对已中毒的敌人造成的伤害提高30%。
- id: hoa.ui.glue.stack_bleed_on_the_pack_then_cash_it_in_with_mortal_strike
  enUS: Stack Bleed on the pack, then cash it in with Mortal Strike.
  zhCN: 对敌群叠加流血，再用致死打击将其转化为伤害。
