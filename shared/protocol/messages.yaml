# HoA typed protocol between the server, the client and the addon bridge.
# `tools/protocol/gen.py` emits the C++ writer and the Rust decoder.
version: 10
messages:
  - name: aura_value
    id: 0x0002
    direction: server_to_client
    fields:
      - { name: spell_id, type: u32 }
      - { name: value, type: u32 }
      - { name: max_value, type: u32 }
  - name: dash
    id: 0x0003
    direction: server_to_client
    fields:
      - { name: max_charges, type: u8 }
      - { name: recharge_ms, type: u32 }
      - { name: cooldown_ms, type: u32 }
      - { name: blink, type: bool }
      - { name: charges, type: u8 }
  - name: aura_percent
    id: 0x0004
    direction: server_to_client
    fields:
      - { name: spell_id, type: u32 }
      - { name: percent, type: f32 }
  - name: aura_text
    id: 0x0005
    direction: server_to_client
    fields:
      - { name: spell_id, type: u32 }
      - { name: text, type: string }
  - name: aura_catalog_entry
    id: 0x0006
    direction: server_to_client
    fields:
      - { name: index, type: u16 }
      - { name: total, type: u16 }
      - { name: spell_id, type: u32 }
      - { name: name, type: string }
      - { name: icon, type: string }
      - { name: description, type: string }
      - { name: stack, type: u32 }
      - { name: duration, type: u32 }
  - name: aura_catalog_end
    id: 0x0007
    direction: server_to_client
    fields:
      - { name: total, type: u16 }
  - name: hello
    id: 0x0001
    direction: server_to_client
    fields:
      - { name: protocol_version, type: u16 }
      - { name: content_hash, type: string }
      - { name: language, type: string }
  - name: run_state
    id: 0x0010
    direction: server_to_client
    fields:
      - { name: elapsed_s, type: u32 }
      - { name: duration_s, type: u32 }
      - { name: kills, type: u32 }
      - { name: gold_earned, type: u32 }
      - { name: player_level, type: u8 }
      - { name: boss_spawned, type: bool }
      - { name: coins, type: u32 }
      - { name: chest_price, type: u32 }
      - { name: stage, type: u32 }
      - { name: portal, type: bool }
      - { name: shards_earned, type: u32 }
      - { name: weapon_stats, type: string }
      - { name: total_s, type: u32 }
      - { name: damage_types, type: string }
  - name: run_start
    id: 0x0011
    direction: server_to_client
    fields:
      - { name: map_name, type: string }
      - { name: difficulty, type: string }
      - { name: duration_s, type: u32 }
      - { name: stage, type: u32 }
      - { name: first_miniboss_s, type: u32 }
      - { name: timeline_marks, type: string }
      - { name: mythic, type: bool }
      - { name: stages, type: u32 }
      - { name: level_name, type: string }
      - { name: finale, type: bool }
      - { name: sandbox, type: bool }
  - name: run_end
    id: 0x0012
    direction: server_to_client
    fields:
      - { name: went_home, type: bool }
      - { name: seconds, type: u32 }
      - { name: kills, type: u32 }
      - { name: gold, type: u32 }
      - { name: player_level, type: u8 }
      - { name: stage, type: u32 }
      - { name: shards, type: u32 }
      - { name: victory, type: bool }
      - { name: mythic, type: bool }
      - { name: best_level, type: u32 }
      - { name: best_before, type: u32 }
      - { name: level_name, type: string }
      - { name: finale_seconds, type: u32 }
  - name: run_paused
    id: 0x0013
    direction: server_to_client
    fields:
      - { name: paused, type: bool }
  - name: coop_no_pause
    id: 0x0014
    direction: server_to_client
    fields:
      - { name: no_pause, type: bool }
  - name: run_xp
    id: 0x0015
    direction: server_to_client
    fields:
      - { name: level, type: u32 }
      - { name: xp, type: u32 }
      - { name: next, type: u32 }
      - { name: orbs, type: u32 }
  - name: wave_beat
    id: 0x0016
    direction: server_to_client
    fields:
      - { name: name, type: string }
      - { name: beat, type: u32 }
      - { name: seconds, type: u32 }
  - name: run_support
    id: 0x0017
    direction: server_to_client
    fields:
      - { name: text, type: string }
  - name: run_glyph_meter
    id: 0x0018
    direction: server_to_client
    fields:
      - { name: text, type: string }
  - name: run_other_meter
    id: 0x0019
    direction: server_to_client
    fields:
      - { name: text, type: string }
  - name: run_party_meter
    id: 0x001A
    direction: server_to_client
    fields:
      - { name: text, type: string }
  - name: objective
    id: 0x001B
    direction: server_to_client
    fields:
      - { name: id, type: u32 }
      - { name: kind, type: string }
      - { name: x, type: f32 }
      - { name: y, type: f32 }
      - { name: map_id, type: u32 }
      - { name: label, type: string }
      - { name: seconds, type: u32 }
      - { name: icon, type: string }
      - { name: description, type: string }
  - name: objective_clear
    id: 0x001C
    direction: server_to_client
    fields:
      - { name: id, type: u32 }
  - name: objective_ping
    id: 0x001D
    direction: server_to_client
    fields:
      - { name: id, type: u32 }
  - name: mob
    id: 0x001E
    direction: server_to_client
    fields:
      - { name: kind, type: u32 }
      - { name: name, type: string }
      - { name: icons, type: string }
      - { name: plate_id, type: u32 }
      - { name: guid, type: string }
  - name: mob_dead
    id: 0x001F
    direction: server_to_client
    fields:
      - { name: name, type: string }
      - { name: plate_id, type: u32 }
      - { name: guid, type: string }
  - name: mob_clear
    id: 0x0020
    direction: server_to_client
    fields: []
  - name: ally
    id: 0x0021
    direction: server_to_client
    fields:
      - { name: name, type: string }
      - { name: plate_id, type: u32 }
      - { name: guid, type: string }
  - name: ally_done
    id: 0x0022
    direction: server_to_client
    fields:
      - { name: plate_id, type: u32 }
      - { name: guid, type: string }
  - name: affix_info
    id: 0x0023
    direction: server_to_client
    fields:
      - { name: name, type: string }
      - { name: icon, type: string }
      - { name: description, type: string }
  - name: offer_open
    id: 0x0024
    direction: server_to_client
    fields:
      - { name: level, type: u32 }
      - { name: count, type: u32 }
      - { name: source, type: string }
      - { name: rerolls, type: u32 }
      - { name: banishes, type: u32 }
      - { name: skips, type: u32 }
  - name: offer_option
    id: 0x0025
    direction: server_to_client
    fields:
      - { name: index, type: u32 }
      - { name: kind, type: string }
      - { name: new_level, type: u32 }
      - { name: max_level, type: u32 }
      - { name: name, type: string }
      - { name: icon, type: string }
      - { name: description, type: string }
      - { name: rarity, type: string }
      - { name: locked, type: bool }
      - { name: damage_before, type: string }
      - { name: damage_after, type: string }
      - { name: damage_label, type: string }
      - { name: banishable, type: bool }
  - name: offer_stat
    id: 0x0026
    direction: server_to_client
    fields:
      - { name: index, type: u32 }
      - { name: label, type: string }
      - { name: before, type: string }
      - { name: after, type: string }
  - name: offer_end
    id: 0x0027
    direction: server_to_client
    fields: []
  - name: offer_closed
    id: 0x0028
    direction: server_to_client
    fields: []
  - name: ley_open
    id: 0x0029
    direction: server_to_client
    fields:
      - { name: count, type: u32 }
  - name: ley_option
    id: 0x002A
    direction: server_to_client
    fields:
      - { name: index, type: u32 }
      - { name: name, type: string }
      - { name: icon, type: string }
      - { name: description, type: string }
      - { name: rarity, type: u32 }
      - { name: kind, type: string }
      - { name: new_level, type: u32 }
      - { name: max_level, type: u32 }
  - name: ley_end
    id: 0x002B
    direction: server_to_client
    fields: []
  - name: ley_closed
    id: 0x002C
    direction: server_to_client
    fields: []
  - name: glyph_offer
    id: 0x002D
    direction: server_to_client
    fields:
      - { name: picks_given, type: u32 }
      - { name: count, type: u32 }
      - { name: rerolls, type: u32 }
  - name: glyph_option
    id: 0x002E
    direction: server_to_client
    fields:
      - { name: index, type: u32 }
      - { name: id, type: u32 }
  - name: glyph_offer_end
    id: 0x002F
    direction: server_to_client
    fields: []
  - name: glyph_close
    id: 0x0030
    direction: server_to_client
    fields: []
  - name: glyph_taken
    id: 0x0031
    direction: server_to_client
    fields:
      - { name: ids, type: string }
  - name: glyph_info
    id: 0x0032
    direction: server_to_client
    fields:
      - { name: id, type: u32 }
      - { name: name, type: string }
      - { name: icon, type: string }
      - { name: rarity, type: u32 }
      - { name: description, type: string }
      - { name: drawback, type: string }
  - name: glyph_count
    id: 0x0033
    direction: server_to_client
    fields:
      - { name: id, type: u32 }
      - { name: count, type: u32 }
