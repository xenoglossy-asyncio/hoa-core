# HoA typed protocol between the server, the client and the addon bridge.
# `tools/protocol/gen.py` emits the C++ writer and the Rust decoder.
version: 1
messages:
  - name: aura_value
    id: 0x0002
    direction: server_to_client
    fields:
      - { name: spell_id, type: u32 }
      - { name: value, type: u32 }
      - { name: max_value, type: u32 }
  - name: dash
    id: 0x0003
    direction: server_to_client
    fields:
      - { name: max_charges, type: u8 }
      - { name: recharge_ms, type: u32 }
      - { name: cooldown_ms, type: u32 }
      - { name: blink, type: bool }
      - { name: charges, type: u8 }
  - name: aura_percent
    id: 0x0004
    direction: server_to_client
    fields:
      - { name: spell_id, type: u32 }
      - { name: percent, type: f32 }
  - name: hello
    id: 0x0001
    direction: server_to_client
    fields:
      - { name: protocol_version, type: u16 }
      - { name: content_hash, type: string }
      - { name: language, type: string }
