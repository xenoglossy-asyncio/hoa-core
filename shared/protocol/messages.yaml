# HoA typed protocol between the server, the client and the addon bridge.
# `tools/protocol/gen.py` emits the C++ writer and the Rust decoder.
version: 4
messages:
  - name: aura_value
    id: 0x0002
    direction: server_to_client
    fields:
      - { name: spell_id, type: u32 }
      - { name: value, type: u32 }
      - { name: max_value, type: u32 }
  - name: dash
    id: 0x0003
    direction: server_to_client
    fields:
      - { name: max_charges, type: u8 }
      - { name: recharge_ms, type: u32 }
      - { name: cooldown_ms, type: u32 }
      - { name: blink, type: bool }
      - { name: charges, type: u8 }
  - name: aura_percent
    id: 0x0004
    direction: server_to_client
    fields:
      - { name: spell_id, type: u32 }
      - { name: percent, type: f32 }
  - name: aura_text
    id: 0x0005
    direction: server_to_client
    fields:
      - { name: spell_id, type: u32 }
      - { name: text, type: string }
  - name: aura_catalog_entry
    id: 0x0006
    direction: server_to_client
    fields:
      - { name: index, type: u16 }
      - { name: total, type: u16 }
      - { name: spell_id, type: u32 }
      - { name: name, type: string }
      - { name: icon, type: string }
      - { name: description, type: string }
      - { name: stack, type: u32 }
      - { name: duration, type: u32 }
  - name: aura_catalog_end
    id: 0x0007
    direction: server_to_client
    fields:
      - { name: total, type: u16 }
  - name: hello
    id: 0x0001
    direction: server_to_client
    fields:
      - { name: protocol_version, type: u16 }
      - { name: content_hash, type: string }
      - { name: language, type: string }
  - name: run_state
    id: 0x0010
    direction: server_to_client
    fields:
      - { name: elapsed_s, type: u32 }
      - { name: duration_s, type: u32 }
      - { name: kills, type: u32 }
      - { name: gold_earned, type: u32 }
      - { name: player_level, type: u8 }
      - { name: boss_spawned, type: bool }
      - { name: coins, type: u32 }
      - { name: chest_price, type: u32 }
      - { name: stage, type: u32 }
      - { name: portal, type: bool }
      - { name: shards_earned, type: u32 }
      - { name: weapon_stats, type: string }
      - { name: total_s, type: u32 }
      - { name: damage_types, type: string }
  - name: run_start
    id: 0x0011
    direction: server_to_client
    fields:
      - { name: map_name, type: string }
      - { name: difficulty, type: string }
      - { name: duration_s, type: u32 }
      - { name: stage, type: u32 }
      - { name: first_miniboss_s, type: u32 }
      - { name: timeline_marks, type: string }
      - { name: mythic, type: bool }
      - { name: stages, type: u32 }
      - { name: level_name, type: string }
      - { name: finale, type: bool }
      - { name: sandbox, type: bool }
  - name: run_end
    id: 0x0012
    direction: server_to_client
    fields:
      - { name: went_home, type: bool }
      - { name: seconds, type: u32 }
      - { name: kills, type: u32 }
      - { name: gold, type: u32 }
      - { name: player_level, type: u8 }
      - { name: stage, type: u32 }
      - { name: shards, type: u32 }
      - { name: victory, type: bool }
      - { name: mythic, type: bool }
      - { name: best_level, type: u32 }
      - { name: best_before, type: u32 }
      - { name: level_name, type: string }
      - { name: finale_seconds, type: u32 }
