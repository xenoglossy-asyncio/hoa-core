name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Check bilingual docs, links and provenance
        run: python scripts/check-docs.py

  i18n-check:
    name: i18n-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Validate the message catalogue
        run: python tools/i18n/check.py
      - name: Check generated catalogue
        run: python tools/i18n/build.py --check
      - name: Check generated server strings
        run: python tools/i18n/gen_server_strings.py --check
      - name: Check generated addon locale
        run: python tools/i18n/gen_addon_locale.py --check

  content-check:
    name: content-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Check generated card content
        run: python tools/content/compile.py --check

  addon-lua:
    name: addon-lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
      - name: Parse addon and GlueXML Lua
        run: bash scripts/build.sh addon

  launcher-build:
    name: launcher-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build launcher
        run: dotnet build launcher/HordesOfAzerothLauncher.csproj -c Release

  client-check:
    name: client-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - name: Check the client workspace
        run: cargo check --manifest-path client/Cargo.toml -p hoa

  server-build:
    name: server-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential \
            cmake \
            libcurl4-openssl-dev \
            libmysqlclient-dev \
            libssl-dev \
            zlib1g-dev
      - name: Configure
        run: |
          cmake -S server -B server/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUPPORTED_CLIENT_BUILD=CLIENT_BUILD_1_12_1 \
            -DBUILD_EXTRACTORS=OFF \
            -DENABLE_MAILSENDER=OFF
      - name: Build mangosd
        run: cmake --build server/build -j"$(nproc)" --target mangosd
